name: Deploy to Google Play

on:
  push:
    branches: [cicd-active]

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew clean testDebug

  distribute:
    name: Distribute bundle to Google Play
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Get keystore
        run: echo ${{ secrets.OZI_KEYSTORE }} | base64 -d > app/keystore.jks

      - name: Version Bump
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle
          versionCode: ${{ github.run_number }}

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Assemble Release Bundle
        run: ./gradlew bundleRelease

#      - name: Sign Release
#        uses: r0adkll/sign-android-release@v1
#        with:
#          releaseDirectory: app/build/outputs/bundle/release
#          signingKeyBase64: ${{ secrets.OZI_KEYSTORE }}
#          keyStorePassword: ${{ secrets.OZI_KEYSTORE_PASSWORD }}
#          alias: ${{ secrets.OZI_KEYSTORE_ALIAS }}
#          keyPassword: ${{ secrets.OZI_KEYSTORE_ALIAS_PASSWORD }}

      - name: Deploy bundle to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_AUTH_JSON }}
          packageName: com.iyke.ozix
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: alpha
          status: 'completed'